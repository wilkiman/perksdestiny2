<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny 2 - Compêndio de Equipamentos PT-BR</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --card-bg: #1a2230;
      --accent: #38bdf8;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --godroll-color: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .search-container { width: 100%; max-width: 600px; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid #334155;
      background-color: #1e293b; color: #fff; font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

    button {
      padding: 0 1.5rem; border-radius: 8px; border: none; background-color: var(--accent);
      color: #0f141d; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
    }
    button:hover { background-color: #7dd3fc; }

    .results-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 0.8rem; }
    .item-card {
      background-color: var(--card-bg); border-radius: 8px; padding: 1rem;
      border: 1px solid #334155; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.2s;
    }
    .item-card:hover { border-color: var(--accent); background-color: #222d3e; }
    .item-icon { width: 48px; height: 48px; border-radius: 6px; border: 1px solid #334155; background-color: #0f141d; }
    .item-info { flex: 1; }
    .item-title { font-size: 1.05rem; font-weight: bold; color: #fff; }
    .item-type { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; margin-top: 0.1rem; }
    .item-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem; }

    .status-msg { text-align: center; color: var(--text-muted); padding: 1rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; padding: 1rem; z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid #334155; border-radius: 12px;
      max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.5rem; position: relative;
    }
    .close-btn {
      position: absolute; top: 1rem; right: 1rem; background: transparent; border: none;
      color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0;
    }
    .modal-header { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .modal-icon { width: 64px; height: 64px; border-radius: 8px; }
    
    .godroll-box { margin-top: 1rem; background: #13221c; border: 1px solid #166534; padding: 1rem; border-radius: 8px; }
    .godroll-title { font-size: 0.95rem; font-weight: bold; color: var(--godroll-color); margin-bottom: 0.5rem; }
    .btn-lightgg { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; background: var(--accent); color: #0f141d; font-weight: bold; text-decoration: none; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>Destiny 2 - Buscador de Perks & God Rolls</h1>
    <p class="subtitle">Pesquisa direta de armas e recomendações de God Roll em PT-BR</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Digite o nome da arma ou armadura..." onkeyup="if(event.key === 'Enter') buscarItem()">
    <button onclick="buscarItem()">Buscar</button>
  </div>

  <div id="results" class="results-list"></div>

  <!-- Modal -->
  <div id="itemModal" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="fecharModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // Cole sua API Key da Bungie aqui
    const API_KEY = "f0edd8cd8a9847e69d7644a080d40c18"; 

    let wishlistMap = {};

    // Carrega a Wishlist do DIM (Voltron)
    async function carregarWishlist() {
      try {
        const res = await fetch("https://raw.githubusercontent.com/DestinyItemManager/DIM/master/src/app/wishlist/v2/voltron.txt");
        const text = await res.text();
        const lines = text.split("\n");

        lines.forEach(line => {
          if (line.startsWith("dimwishlist:item=")) {
            const parts = line.replace("dimwishlist:item=", "").split("&perks=");
            const itemHash = parts[0];
            const note = line.includes("#notes:") ? line.split("#notes:")[1] : "Recomendado pela comunidade DIM";

            if (!wishlistMap[itemHash]) {
              wishlistMap[itemHash] = [];
            }
            wishlistMap[itemHash].push(note);
          }
        });
      } catch (err) {
        console.log("Erro ao carregar wishlist", err);
      }
    }

    carregarWishlist();

    async function buscarItem() {
      const query = document.getElementById("searchInput").value.trim();
      const resultsContainer = document.getElementById("results");

      if (!query) return;

      resultsContainer.innerHTML = `<div class="status-msg">Pesquisando na Bungie...</div>`;

      try {
        // Uso de endpoint via proxy CORS para evitar bloqueio do navegador no GitHub Pages
        const bungieUrl = `https://www.bungie.net/Platform/Destiny2/Armory/Search/DestinyInventoryItemDefinition/${encodeURIComponent(query)}/?lc=pt-br`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(bungieUrl)}`;

        const response = await fetch(proxyUrl, {
          headers: {
            "X-API-Key": API_KEY
          }
        });

        if (!response.ok) throw new Error("Erro na requisição");

        const data = await response.json();
        const results = data.Response?.results?.results || [];

        if (results.length === 0) {
          resultsContainer.innerHTML = `<div class="status-msg">Nenhum item encontrado para "${query}".</div>`;
          return;
        }

        resultsContainer.innerHTML = "";

        results.slice(0, 15).forEach(item => {
          const display = item.displayProperties || {};
          const iconUrl = display.icon ? `https://www.bungie.net${display.icon}` : "https://www.bungie.net/img/misc/missing_icon.png";
          const name = display.name || "Item sem nome";
          const itemType = item.itemTypeDisplayName || "Equipamento";
          const description = display.description || "Sem descrição disponível.";

          const card = document.createElement("div");
          card.className = "item-card";
          card.onclick = () => verDetalhesItem(item);
          card.innerHTML = `
            <img class="item-icon" src="${iconUrl}" alt="${name}">
            <div class="item-info">
              <div class="item-title">${name}</div>
              <div class="item-type">${itemType}</div>
              <div class="item-desc">${description}</div>
            </div>
          `;
          resultsContainer.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        resultsContainer.innerHTML = `<div class="status-msg" style="color: #ef4444;">Erro ao realizar a busca. Tente novamente em instantes.</div>`;
      }
    }

    function verDetalhesItem(item) {
      const modal = document.getElementById("itemModal");
      const modalBody = document.getElementById("modalBody");
      
      modal.style.display = "flex";
      
      const display = item.displayProperties || {};
      const iconUrl = display.icon ? `https://www.bungie.net${display.icon}` : "";
      const hash = item.hash;
      const urlLightGG = `https://www.lightgg.com/db/pt-br/items/${hash}`;

      const godRolls = wishlistMap[hash] || [];

      let godRollHtml = "";
      if (godRolls.length > 0) {
        godRollHtml = `
          <div class="godroll-box">
            <div class="godroll-title">✨ Recomendação de God Roll (DIM):</div>
            <p style="font-size: 0.85rem; color: #d1fae5;">${godRolls[0]}</p>
          </div>
        `;
      } else {
        godRollHtml = `
          <div class="godroll-box" style="background: #1e293b; border-color: #334155;">
            <div class="godroll-title" style="color: var(--text-muted);">ℹ️ God Roll:</div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Consulte os perks completos diretamente no Light.gg abaixo.</p>
          </div>
        `;
      }

      modalBody.innerHTML = `
        <div class="modal-header">
          ${iconUrl ? `<img class="modal-icon" src="${iconUrl}">` : ""}
          <div>
            <h2 style="color: #fff;">${display.name || "Item sem nome"}</h2>
            <div style="color: var(--accent); font-size: 0.85rem;">${item.itemTypeDisplayName || ""}</div>
          </div>
        </div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">${display.description || "Sem descrição."}</p>
        
        ${godRollHtml}

        <a href="${urlLightGG}" target="_blank" class="btn-lightgg">Ver God Rolls no Light.gg ↗</a>
      `;
    }

    function fecharModal() {
      document.getElementById("itemModal").style.display = "none";
    }
  </script>
</body>
</html>
