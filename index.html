<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny 2 - Compêndio de Equipamentos PT-BR</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --card-bg: #1a2230;
      --accent: #38bdf8;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .search-container { width: 100%; max-width: 600px; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid #334155;
      background-color: #1e293b; color: #fff; font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

    button {
      padding: 0 1.5rem; border-radius: 8px; border: none; background-color: var(--accent);
      color: #0f141d; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
    }
    button:hover { background-color: #7dd3fc; }

    .results-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 0.8rem; }
    .item-card {
      background-color: var(--card-bg); border-radius: 8px; padding: 1.2rem;
      border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;
    }
    .item-info { flex: 1; }
    .item-title { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .item-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem; }

    .btn-link {
      padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none;
      font-weight: bold; font-size: 0.85rem; background-color: var(--accent); color: #0f141d;
    }
    .btn-link:hover { background-color: #7dd3fc; }
  </style>
</head>
<body>

  <header>
    <h1>Destiny 2 - Buscador de Perks & God Rolls</h1>
    <p class="subtitle">Pesquise armas ou armaduras em Português do Brasil</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Digite o nome da arma ou armadura em PT-BR..." onkeyup="if(event.key === 'Enter') buscarItem()">
    <button onclick="buscarItem()">Buscar</button>
  </div>

  <div id="results" class="results-list"></div>

  <script>
    function buscarItem() {
      const query = document.getElementById("searchInput").value.trim();
      const resultsContainer = document.getElementById("results");

      if (!query) return;

      const urlLightGG = `https://www.lightgg.com/db/pt-br/search?q=${encodeURIComponent(query)}`;

      resultsContainer.innerHTML = `
        <div class="item-card">
          <div class="item-info">
            <div class="item-title">🔍 Pesquisar "${query}"</div>
            <div class="item-desc">Acessar base completa de dados em Português (PT-BR)</div>
          </div>
          <a href="${urlLightGG}" target="_blank" class="btn-link">Ver no Light.gg</a>
        </div>
      `;

      // Redireciona automaticamente em uma nova aba para agilizar
      window.open(urlLightGG, '_blank');
    }
  </script>
</body>
</html>
