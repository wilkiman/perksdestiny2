<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny 2 - Compêndio de Equipamentos PT-BR</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --card-bg: #1a2230;
      --accent: #38bdf8;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .search-container { width: 100%; max-width: 600px; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid #334155;
      background-color: #1e293b; color: #fff; font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

    button {
      padding: 0 1.5rem; border-radius: 8px; border: none; background-color: var(--accent);
      color: #0f141d; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
    }
    button:hover { background-color: #7dd3fc; }

    .results-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 0.8rem; }
    .item-card {
      background-color: var(--card-bg); border-radius: 8px; padding: 1rem;
      border: 1px solid #334155; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.2s;
    }
    .item-card:hover { border-color: var(--accent); background-color: #222d3e; }
    .item-icon { width: 48px; height: 48px; border-radius: 6px; border: 1px solid #334155; background-color: #0f141d; }
    .item-info { flex: 1; }
    .item-title { font-size: 1.05rem; font-weight: bold; color: #fff; }
    .item-type { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; margin-top: 0.1rem; }
    .item-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem; }

    .status-msg { text-align: center; color: var(--text-muted); padding: 1rem; }

    /* Modal de Detalhes */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; padding: 1rem; z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid #334155; border-radius: 12px;
      max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.5rem; position: relative;
    }
    .close-btn {
      position: absolute; top: 1rem; right: 1rem; background: transparent; border: none;
      color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0;
    }
    .modal-header { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .modal-icon { width: 64px; height: 64px; border-radius: 8px; }
    .perks-section { margin-top: 1.5rem; border-top: 1px solid #334155; padding-top: 1rem; }
    .perks-title { font-size: 1rem; font-weight: bold; color: var(--accent); margin-bottom: 0.8rem; }
    .perk-item { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 0.8rem; background: #131b26; padding: 0.6rem; border-radius: 6px; }
    .perk-icon { width: 32px; height: 32px; }
  </style>
</head>
<body>

  <header>
    <h1>Destiny 2 - Buscador de Perks & Equipamentos</h1>
    <p class="subtitle">Pesquise armas ou armaduras consumindo a API da Bungie em PT-BR</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Digite o nome da arma ou armadura..." onkeyup="if(event.key === 'Enter') buscarItem()">
    <button onclick="buscarItem()">Buscar</button>
  </div>

  <div id="results" class="results-list"></div>

  <!-- Modal -->
  <div id="itemModal" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="fecharModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // Cole aqui a sua API Key da Bungie
    const API_KEY = "ba5ad4bae796481a8c6e222c56b584a4"; 

    async function buscarItem() {
      const query = document.getElementById("searchInput").value.trim();
      const resultsContainer = document.getElementById("results");

      if (!query) return;

      resultsContainer.innerHTML = `<div class="status-msg">Carregando dados da Bungie...</div>`;

      try {
        // Endpoint oficial atualizado da Bungie para busca de entidades
        const response = await fetch(`https://www.bungie.net/Platform/Destiny2/Armory/Search/DestinyInventoryItemDefinition/${encodeURIComponent(query)}/?lc=pt-br`, {
          headers: { 
            "X-API-Key": API_KEY 
          }
        });

        if (!response.ok) {
          throw new Error(`Status ${response.status}`);
        }

        const data = await response.json();
        
        // Verifica o código de resposta da Bungie (1000 = Success / Ok)
        if (data.ErrorCode !== 1) {
          throw new Error(data.Message || "Erro na resposta da API");
        }

        const results = data.Response?.results?.results || [];

        if (results.length === 0) {
          resultsContainer.innerHTML = `<div class="status-msg">Nenhum item encontrado para "${query}".</div>`;
          return;
        }

        resultsContainer.innerHTML = "";

        results.slice(0, 15).forEach(item => {
          const display = item.displayProperties || {};
          const iconUrl = display.icon ? `https://www.bungie.net${display.icon}` : "https://www.bungie.net/img/misc/missing_icon.png";
          const name = display.name || "Item sem nome";
          const itemType = item.itemTypeDisplayName || "Equipamento";
          const description = display.description || "Sem descrição disponível.";

          const card = document.createElement("div");
          card.className = "item-card";
          card.onclick = () => verDetalhesItem(item.hash);
          card.innerHTML = `
            <img class="item-icon" src="${iconUrl}" alt="${name}">
            <div class="item-info">
              <div class="item-title">${name}</div>
              <div class="item-type">${itemType}</div>
              <div class="item-desc">${description}</div>
            </div>
          `;
          resultsContainer.appendChild(card);
        });

      } catch (error) {
        console.error("Erro no Fetch:", error);
        resultsContainer.innerHTML = `<div class="status-msg" style="color: #ef4444;">Erro ao buscar dados. Verifique sua chave de API ou tente novamente.</div>`;
      }
    }

    async function verDetalhesItem(itemHash) {
      const modal = document.getElementById("itemModal");
      const modalBody = document.getElementById("modalBody");
      
      modal.style.display = "flex";
      modalBody.innerHTML = `<div class="status-msg">Carregando detalhes do item...</div>`;

      try {
        const response = await fetch(`https://www.bungie.net/Platform/Destiny2/Manifest/DestinyInventoryItemDefinition/${itemHash}/?lc=pt-br`, {
          headers: { "X-API-Key": API_KEY }
        });

        if (!response.ok) throw new Error("Erro ao obter detalhes");

        const data = await response.json();
        const item = data.Response;
        const display = item.displayProperties || {};
        const iconUrl = display.icon ? `https://www.bungie.net${display.icon}` : "";

        let perksHtml = "";
        
        if (item.sockets && item.sockets.socketEntries) {
          perksHtml = `<div class="perks-section"><div class="perks-title">Sockets / Perks Disponíveis:</div>`;
          
          for (const socket of item.sockets.socketEntries.slice(0, 8)) {
            if (socket.singleInitialItemHash) {
              const perkData = await buscarDetalhesPerk(socket.singleInitialItemHash);
              if (perkData && perkData.displayProperties?.name) {
                const perkIcon = perkData.displayProperties.icon ? `https://www.bungie.net${perkData.displayProperties.icon}` : "";
                perksHtml += `
                  <div class="perk-item">
                    ${perkIcon ? `<img class="perk-icon" src="${perkIcon}">` : ""}
                    <div>
                      <strong>${perkData.displayProperties.name}</strong>
                      <div style="font-size: 0.8rem; color: var(--text-muted);">${perkData.displayProperties.description || "Sem descrição"}</div>
                    </div>
                  </div>
                `;
              }
            }
          }
          perksHtml += `</div>`;
        }

        modalBody.innerHTML = `
          <div class="modal-header">
            ${iconUrl ? `<img class="modal-icon" src="${iconUrl}">` : ""}
            <div>
              <h2 style="color: #fff;">${display.name || "Item sem nome"}</h2>
              <div style="color: var(--accent); font-size: 0.85rem;">${item.itemTypeDisplayName || ""}</div>
            </div>
          </div>
          <p style="color: var(--text-muted); font-size: 0.95rem;">${display.description || "Sem descrição."}</p>
          ${perksHtml}
        `;

      } catch (err) {
        console.error(err);
        modalBody.innerHTML = `<div class="status-msg" style="color: #ef4444;">Erro ao carregar detalhes.</div>`;
      }
    }

    async function buscarDetalhesPerk(perkHash) {
      try {
        const res = await fetch(`https://www.bungie.net/Platform/Destiny2/Manifest/DestinyInventoryItemDefinition/${perkHash}/?lc=pt-br`, {
          headers: { "X-API-Key": API_KEY }
        });
        const data = await res.json();
        return data.Response;
      } catch (e) {
        return null;
      }
    }

    function fecharModal(e) {
      document.getElementById("itemModal").style.display = "none";
    }
  </script>
</body>
</html>
