<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny 2 - Compêndio de Equipamentos PT-BR</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --card-bg: #1a2230;
      --accent: #38bdf8;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .search-container { width: 100%; max-width: 600px; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid #334155;
      background-color: #1e293b; color: #fff; font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

    button {
      padding: 0 1.5rem; border-radius: 8px; border: none; background-color: var(--accent);
      color: #0f141d; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
    }
    button:hover { background-color: #7dd3fc; }

    .results-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 0.8rem; }
    .item-card {
      background-color: var(--card-bg); border-radius: 8px; padding: 1rem;
      border: 1px solid #334155; display: flex; align-items: center; gap: 1rem;
    }
    .item-icon { width: 48px; height: 48px; border-radius: 6px; border: 1px solid #334155; background-color: #0f141d; }
    .item-info { flex: 1; }
    .item-title { font-size: 1.05rem; font-weight: bold; color: #fff; }
    .item-type { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; margin-top: 0.1rem; }
    .item-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem; }

    .status-msg { text-align: center; color: var(--text-muted); padding: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1>Destiny 2 - Buscador de Perks & Equipamentos</h1>
    <p class="subtitle">Pesquise armas ou armaduras consumindo a API da Bungie em PT-BR</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Digite o nome da arma ou armadura..." onkeyup="if(event.key === 'Enter') buscarItem()">
    <button onclick="buscarItem()">Buscar</button>
  </div>

  <div id="results" class="results-list"></div>

  <script>
    // Substitua 'SUA_CHAVE_DE_API_AQUI' pela sua API Key obtida em https://www.bungie.net/en/Application
    const API_KEY = "f0edd8cd8a9847e69d7644a080d40c18"; 

    async function buscarItem() {
      const query = document.getElementById("searchInput").value.trim();
      const resultsContainer = document.getElementById("results");

      if (!query) return;

      resultsContainer.innerHTML = `<div class="status-msg">Carregando dados da Bungie...</div>`;

      try {
        // Busca itens na API da Bungie na linguagem Português Brasil (pt-br)
        const response = await fetch(`https://www.bungie.net/Platform/Destiny2/Armory/Search/DestinyInventoryItemDefinition/${encodeURIComponent(query)}/?lc=pt-br`, {
          headers: {
            "X-API-Key": API_KEY
          }
        });

        if (!response.ok) {
          throw new Error(`Erro na API: ${response.status}`);
        }

        const data = await response.json();
        const results = data.Response?.results?.results || [];

        if (results.length === 0) {
          resultsContainer.innerHTML = `<div class="status-msg">Nenhum item encontrado para "${query}".</div>`;
          return;
        }

        resultsContainer.innerHTML = "";

        // Limita a exibição aos primeiros 15 resultados
        results.slice(0, 15).forEach(item => {
          const display = item.displayProperties || {};
          const iconUrl = display.icon ? `https://www.bungie.net${display.icon}` : "https://www.bungie.net/img/misc/missing_icon.png";
          const name = display.name || "Item sem nome";
          const itemType = item.itemTypeDisplayName || "Equipamento";
          const description = display.description || "Sem descrição disponível.";

          const card = document.createElement("div");
          card.className = "item-card";
          card.innerHTML = `
            <img class="item-icon" src="${iconUrl}" alt="${name}">
            <div class="item-info">
              <div class="item-title">${name}</div>
              <div class="item-type">${itemType}</div>
              <div class="item-desc">${description}</div>
            </div>
          `;
          resultsContainer.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        resultsContainer.innerHTML = `<div class="status-msg" style="color: #ef4444;">Erro ao buscar dados. Verifique a chave de API e tente novamente.</div>`;
      }
    }
  </script>
</body>
</html>
